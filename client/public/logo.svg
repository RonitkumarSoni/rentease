  <!-- Main house/building shape -->
  <path d="M 60 130 L 60 80 L 100 50 L 140 80 L 140 130" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Roof lines -->
  <line x1="100" y1="50" x2="60" y2="80" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="50" x2="140" y2="80" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Door -->
  <rect x="90" y="100" width="20" height="30" fill="none" stroke="#10B981" stroke-width="2" rx="2"/>
  <circle cx="109" cy="115" r="2" fill="#10B981"/>
  
  <!-- Windows -->
  <rect x="68" y="88" width="14" height="14" fill="none" stroke="#10B981" stroke-width="1.5" rx="1"/>
  <line x1="75" y1="88" x2="75" y2="102" stroke="#10B981" stroke-width="1.5"/>
  <line x1="68" y1="95" x2="82" y2="95" stroke="#10B981" stroke-width="1.5"/>
  
  <rect x="118" y="88" width="14" height="14" fill="none" stroke="#10B981" stroke-width="1.5" rx="1"/>
  <line x1="125" y1="88" x2="125" y2="102" stroke="#10B981" stroke-width="1.5"/>
  <line x1="118" y1="95" x2="132" y2="95" stroke="#10B981" stroke-width="1.5"/>
  
  <!-- Base line -->
