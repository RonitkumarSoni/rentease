<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Main Icon Container - Geometric "R" with house concept -->
  <g transform="translate(50, 35)">
    <!-- Vertical stroke of R - Left edge -->
    <rect x="0" y="0" width="16" height="95" fill="url(#primaryGradient)" rx="4"/>
    
    <!-- Horizontal top of R - creating roof line -->
    <rect x="16" y="0" width="50" height="16" fill="url(#primaryGradient)" rx="4"/>
    
    <!-- Curved bowl of R - upper loop -->
    <path d="M 66 16 Q 85 16 85 40 Q 85 55 70 60 L 16 60" fill="none" stroke="url(#primaryGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Diagonal leg of R - angled downward -->
    <line x1="52" y1="60" x2="70" y2="95" stroke="url(#primaryGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Negative space: House-like cutout in center -->
    <path d="M 45 25 L 65 8 L 85 25 L 85 50 L 45 50 Z" fill="white" opacity="0.95"/>
    
    <!-- Accent: Key-like design (circular hole for house) -->
    <circle cx="65" cy="35" r="6" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Accent dot - representing transaction/movement -->
  <circle cx="155" cy="90" r="10" fill="url(#accentGradient)"/>
  <circle cx="155" cy="90" r="6" fill="white"/>
  
  <!-- Subtle corner accent for premium feel -->
  <path d="M 160 20 L 170 20 L 160 30 Z" fill="url(#accentGradient)" opacity="0.8"/>
  
  <!-- Brand name for context (can be hidden in actual favicon) -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0066FF" letter-spacing="0.5">RENTEASE</text>
</svg>