<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Mobile Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Title (Most Important for SEO) -->
    <title>RentEase - Quality Rentals at Your Fingertips | Buy, Sell & Rent Anything</title>

    <!-- Primary Meta Description -->
    <meta
      name="description"
      content="RentEase is your one-stop rental marketplace to buy, sell, and rent anything. Discover affordable rentals, connect with trusted sellers, and get quality items delivered. Start renting today!"
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="rental marketplace, buy rent sell, affordable rentals, online rentals, RentEase, rental platform, items for rent, quality rentals"
    />

    <!-- Author -->
    <meta name="author" content="RentEase" />

    <!-- Theme Color (Mobile Browsers) -->
    <meta name="theme-color" content="#10B981" />

    <!-- Canonical URL (Avoid duplicate content issues) -->
    <link rel="canonical" href="https://rent-ease-gold.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (For WhatsApp, LinkedIn, Facebook sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RentEase - Quality Rentals at Your Fingertips" />
    <meta
      property="og:description"
      content="Rent, buy, and sell anything on RentEase. The most trusted rental marketplace for quality items at affordable prices."
    />
    <meta property="og:url" content="https://rent-ease-gold.vercel.app" />
    <meta
      property="og:image"
      content="https://rent-ease-gold.vercel.app/favicon.svg"
    />
    <meta property="og:site_name" content="RentEase" />

    <!-- Twitter Card (For Twitter/X sharing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RentEase - Quality Rentals Marketplace" />
    <meta
      name="twitter:description"
      content="Rent, buy, and sell anything on RentEase. The most trusted rental marketplace for quality items at affordable prices."
    />
    <meta
      name="twitter:image"
      content="https://rent-ease-gold.vercel.app/favicon.svg"
    />
    <meta name="twitter:url" content="https://rent-ease-gold.vercel.app" />

    <!-- Robots Instruction -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Structured Data (Schema.org for better indexing) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RentEase",
        "description": "Quality rentals at your fingertips - buy, sell, and rent anything",
        "url": "https://rent-ease-gold.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://rent-ease-gold.vercel.app/browse?search={search_term_string}"
          }
        },
        "sameAs": [
          "https://facebook.com/rentease",
          "https://twitter.com/rentease",
          "https://instagram.com/rentease"
        ]
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RentEase",
        "description": "Rent, buy, and sell anything on our trusted rental marketplace",
        "url": "https://rent-ease-gold.vercel.app",
        "logo": "https://rent-ease-gold.vercel.app/favicon.svg",
        "contact": {
          "@type": "ContactPoint",
          "telephone": "+1-800-RENTEASE",
          "contactType": "Customer Support"
        }
      }
    </script>

    <!-- Preconnect for Performance (Optional but Good Practice) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  </head>

  <body>
    <!-- Root Element for React -->
    <div id="root"></div>

    <!-- Optional: Fallback content for SEO (if JS fails) -->
    <noscript>
      <h1>RentEase - Quality Rentals at Your Fingertips</h1>
      <p>
        RentEase is your one-stop rental marketplace to buy, sell, and rent anything. 
        Discover affordable rentals, connect with trusted sellers, and get quality items delivered.
      </p>
    </noscript>

    <!-- React App Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
